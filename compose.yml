services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bd
      POSTGRES_USER: bduser
      POSTGRES_PASSWORD: "supersecretpassword"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: bd
      POSTGRES_USER: bduser
      POSTGRES_PASSWORD: "supersecretpassword"
      POSTGRES_SSL: "false"
    depends_on:
      - db

volumes:
  pgdata:
